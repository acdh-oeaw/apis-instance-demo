[project]
name = "apis-instance-demo"
version = "0.1.0"
description = "Demo APIS Instance"
authors = [{ name = "Saranya Balasubramanian" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.13"
packages = [{include = "apis_ontology"}]
dependencies = [
    "apis-core-rdf @ git+https://github.com/acdh-oeaw/apis-core-rdf.git@birger/search",
    "apis-acdhch-default-settings==2.20.0",
    "psycopg[binary]>=3.2",
    "faker>=37.5.3",
    "django-cosmograph==0.3.11",
    "apis-bibsonomy>=0.13.2",
    "apis-highlighter-ng>=0.6.4",
    "apis-data-explorer==0.0.9",
]

[tool.hatch.build.targets.wheel]
packages = ["apis_ontology"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true
